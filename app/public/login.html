<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Log In - Stock Market Simulator</title>
        <link rel="stylesheet" href="styles/styles.css">
        <link rel="stylesheet" href="styles/fullscreen.css">
        <style>
            .field { margin: 1rem 0; }
        </style>
    </head>
    <body>
        <div id="nav">
            <a id="home" href="index.html">
                <img src="logo.svg" alt="Logo">
                <h4>Stock Market Simulator</h4>
            </a>
            <button id="nav-login">Log In</button>
        </div>
        <div id="card">
            <div id="card-header">
                <h2>Stock Market Simulator</h2>
                <p>Log in to continue</p>
            </div>
            <small class="error" id="login-error"></small>
            <div id="form">
                <div class="field">
                    <label for="username">Username</label>
                    <input 
                        id="username" 
                        type="text"
                        placeholder="Enter your username" 
                        minlength="3" 
                        maxlength="24" 
                        required
                    />
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input 
                        id="password" 
                        type="password"
                        placeholder="Enter your password"
                    >
                </div>
            </div>
            <button id="submit">Log In</button>
            <p id="redirect">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
        <script src="scripts/login.js"></script>
    </body>
</html>
