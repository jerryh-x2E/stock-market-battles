<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Stock Market Simulator</title>
        <link rel="stylesheet" href="styles/styles.css">
        <link rel="stylesheet" href="styles/fullscreen.css">
    </head>
    <body>
        <div id="nav">
            <a id="home" href="index.html">
                <img src="logo.svg" alt="Logo">
                <h4>Stock Market Simulator</h4>
            </a>
            <button id="nav-login">Log In</button>
        </div>
        <div id="hero">
            <h1>Compete with friends in the stock market</h1>
            <p>Same starting cash with real prices. Be crowned the winner.</p>
            <button id="join">Join</button>
        </div>
        <script>
            document.getElementById("nav-login").addEventListener("click", event => {
                window.location.href = "login.html";
            });
            document.getElementById("join").addEventListener("click", event => {
                window.location.href = "signup.html";
            });
        </script>
    </body>
</html>
