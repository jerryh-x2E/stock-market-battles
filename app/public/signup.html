<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Sign up - Stock Market Simulator</title>
        <link rel="stylesheet" href="styles/styles.css">
        <link rel="stylesheet" href="styles/fullscreen.css">
        <style>
            .field { margin: 0; }
        </style>
    </head>
    <body>
        <div id="nav">
            <a id="home" href="index.html">
                <img src="logo.svg" alt="Logo">
                <h4>Stock Market Simulator</h4>
            </a>
            <button id="nav-login">Log In</button>
        </div>
        <div id="card">
            <div id="card-header">
                <h2>Sign Up</h2>
            </div>
            <small class="error" id="signup-error"></small>
            <div id="form">
                <div class="field">
                    <label for="username">Username (3-24 characters)</label>
                    <input 
                        id="username" 
                        type="text"
                        placeholder="Enter your username" 
                        minlength="3" 
                        maxlength="24" 
                        required
                    />
                    <small class="error" id="username-error"></small>
                </div>
                <div class="field">
                    <label for="password">Password (at least 6 characters)</label>
                    <input 
                        id="password" 
                        type="password"
                        placeholder="Enter your password"
                    />
                    <small class="error" id="password-error"></small>
                </div>
                <div class="field">
                    <label for="password">Confirm password</label>
                    <input 
                        id="confirm-password"
                        placeholder="Confirm your password" 
                        type="password"
                    />
                    <small class="error" id="confirm-error"></small>
                </div>
            </div>
            <button id="submit">Sign Up</button>
            <p id="redirect">Already have an account? <a href="login.html">Log In</a></p>
        </div>
        <script src="scripts/signup.js"></script>
    </body>
</html>
